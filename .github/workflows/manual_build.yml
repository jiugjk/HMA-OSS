name: Manual Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        default: future
        type: string
      build_type:
        description: Build variant
        required: true
        default: BOTH
        type: choice
        options:
          - RELEASE
          - DEBUG
          - BOTH

jobs:
  build:
    name: Build ${{ inputs.build_type }} from ${{ inputs.branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive
          fetch-depth: 0

      - name: Gradle wrapper validation
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Write signing key from secrets
        if: inputs.build_type == 'RELEASE' || inputs.build_type == 'BOTH'
        env:
          KEY_STORE_B64: ${{ secrets.KEY_STORE }}
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALIAS_KEY_PASSWORD }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_API_KEY: ${{ secrets.CROWDIN_LIST_MEMBERS_API_TOKEN }}
        run: |
          if [ -z "$KEY_STORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing signing secrets. Set KEY_STORE, KEY_STORE_PASSWORD, ALIAS, ALIAS_KEY_PASSWORD in repo Actions secrets."
            exit 1
          fi
          echo "$KEY_STORE_B64" | base64 --decode > key.jks
          {
            echo "officialBuild=true"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "fileDir=$(pwd)/key.jks"
            if [ -n "$CROWDIN_PROJECT_ID" ]; then echo "crowdinProjectId=$CROWDIN_PROJECT_ID"; fi
            if [ -n "$CROWDIN_API_KEY" ]; then echo "crowdinApiKey=$CROWDIN_API_KEY"; fi
          } >> local.properties

      - name: Prepare debug env
        if: inputs.build_type == 'DEBUG'
        run: |
          touch local.properties
          mkdir -p ~/.config/.android
          ln -sfn ~/.config/.android ~/.android
          if [ ! -f ~/.config/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.config/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Gradle prebuild
        run: |
          echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties
          ./gradlew prebuild

      - name: Build RELEASE
        if: inputs.build_type == 'RELEASE' || inputs.build_type == 'BOTH'
        id: buildRelease
        run: |
          # zygote:generate*SignInfo needs the manager APK already on disk
          ./gradlew :app:assembleRelease
          ./gradlew :zygote:assembleRelease
          echo "releaseName=$(ls zygote/build/outputs/magisk/release/*.zip | awk -F '(/|.zip)' '{print $6}')" >> "$GITHUB_OUTPUT"
          echo "releaseFile=$(ls zygote/build/outputs/magisk/release/*.zip)" >> "$GITHUB_OUTPUT"

      - name: Build DEBUG
        if: inputs.build_type == 'DEBUG' || inputs.build_type == 'BOTH'
        id: buildDebug
        run: |
          ./gradlew :app:assembleDebug
          ./gradlew :zygote:assembleDebug
          echo "debugName=$(ls zygote/build/outputs/magisk/debug/*.zip | awk -F '(/|.zip)' '{print $6}')" >> "$GITHUB_OUTPUT"
          echo "debugFile=$(ls zygote/build/outputs/magisk/debug/*.zip)" >> "$GITHUB_OUTPUT"

      - name: Upload RELEASE
        if: success() && (inputs.build_type == 'RELEASE' || inputs.build_type == 'BOTH')
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: ${{ steps.buildRelease.outputs.releaseName }}
          path: ${{ steps.buildRelease.outputs.releaseFile }}

      - name: Upload DEBUG
        if: success() && (inputs.build_type == 'DEBUG' || inputs.build_type == 'BOTH')
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: ${{ steps.buildDebug.outputs.debugName }}
          path: ${{ steps.buildDebug.outputs.debugFile }}

      - name: Upload RELEASE mappings
        if: success() && (inputs.build_type == 'RELEASE' || inputs.build_type == 'BOTH')
        uses: actions/upload-artifact@v7
        with:
          name: mappings-release
          path: |
            app/build/outputs/mapping/release
            zygote/build/outputs/mapping/release
          if-no-files-found: ignore
